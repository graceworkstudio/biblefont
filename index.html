    <style>
      /* iOS 블랙 스크린 방지: html 요소에 배경색 즉시 적용 */
      html {
        background-color: #ffffff;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
      }
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 9999;
        gap: 16px;
      }
      .splash-icon {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        animation: splashPop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
      }
      .splash-title {
        font-family: sans-serif;
        font-weight: 800;
        color: #1e293b;
        font-size: 22px;
        letter-spacing: -0.5px;
        animation: splashFade 0.4s 0.15s ease both;
      }
      .splash-subtitle {
        font-family: sans-serif;
        font-weight: 500;
        color: #94a3b8;
        font-size: 13px;
        animation: splashFade 0.4s 0.25s ease both;
      }
      .splash-bar {
        width: 48px;
        height: 4px;
        border-radius: 2px;
        background: #f1f5f9;
        overflow: hidden;
        animation: splashFade 0.4s 0.3s ease both;
      }
      .splash-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #fbbf24, #f97316);
        border-radius: 2px;
        animation: splashLoad 1.2s 0.4s ease-in-out infinite;
      }
      @keyframes splashPop {
        from { transform: scale(0.7); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }
      @keyframes splashFade {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes splashLoad {
        0%   { width: 0%; margin-left: 0; }
        50%  { width: 100%; margin-left: 0; }
        100% { width: 0%; margin-left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <img src="/icon-192.png" class="splash-icon" alt="바이블줌" />
        <div class="splash-title">바이블줌</div>
        <div class="splash-subtitle">내 눈에 맞는 성경 찾기</div>
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      </div>
    </div>
