name: Deploy to Cafe24 FTP

# 2026-11-25: 푸시할 때마다 운영 폴더를 덮어쓰지 않도록 수동 실행 전용으로 바꿈.
# 운영 반영은 카페24 파일업로더로 직접 올린다.
on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Cafe24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /web/biblezoom/
          dangerous-clean-slate: false
          exclude: |
            **/.ftp-deploy-sync-state.json
