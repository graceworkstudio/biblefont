name: Deploy to Cafe24 FTP

on:
  push:
    branches:
      - main
      - feature/api-transition
      - ui-redesign-temp

jobs:
  web-deploy:
    name: Deploy to Cafe24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/'
          remote_path: '/www/biblezoom_test'
          sftp_only: true
