name: Deploy to Cafe24 FTP

on:
  push:
    branches:
      - main
      - feature/api-transition
      - ui-redesign-temp

jobs:
  web-deploy:
    name: Deploy to Cafe24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy via SFTP
        uses: nupulse/actions-sftp-deploy@v1.2
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local-path: './dist'
          remote-path: '/www/biblezoom_test'
